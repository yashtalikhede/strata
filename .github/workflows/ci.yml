name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      # Both platforms report, so a failure on one still shows the other's
      # result. macOS matters here because its fsync is F_FULLFSYNC, which
      # the crash-safety tests lean on heavily.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: make check
        run: make check
