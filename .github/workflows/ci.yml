name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      # fail-fast off, so a failure on one platform still shows the other's result.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: check
          # macOS fsync is F_FULLFSYNC, costing milliseconds a call, so the full
          # suite takes several times longer there; it runs the short suite and
          # the remaining checks instead, and ubuntu covers the full one.
          - os: macos-latest
            targets: test-short vet fmt-check build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: make ${{ matrix.targets }}
        run: make ${{ matrix.targets }}
